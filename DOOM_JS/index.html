<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>DOOM PORTUGOL - RIP AND TEAR! | Marine vs Inferno</title>
    <link
      rel="shortcut icon"
      href="./img/doom-favicon.jpg"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <style>
      @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050608;
        font-family: "DotGothic16", sans-serif, monospace;
      }

      body {
        padding: 16px;
        background: linear-gradient(145deg, #0a0c12 0%, #030507 100%);
      }

      .damage-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1000;
        opacity: 0;
        transition: opacity 0.1s ease;
      }

      .damage-overlay.active {
        opacity: 1;
      }

      .screen-blood {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          circle,
          rgba(139, 0, 0, 0) 0%,
          rgba(139, 0, 0, 0.3) 50%,
          rgba(180, 0, 0, 0.6) 80%,
          rgba(100, 0, 0, 0.8) 100%
        );
        mix-blend-mode: multiply;
      }

      .blood-splatter {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="30" r="3" fill="%238b0000" opacity="0.6"/><circle cx="75" cy="25" r="4" fill="%238b0000" opacity="0.5"/><circle cx="45" cy="80" r="5" fill="%238b0000" opacity="0.4"/><circle cx="85" cy="70" r="3" fill="%238b0000" opacity="0.7"/><circle cx="15" cy="85" r="4" fill="%238b0000" opacity="0.5"/><path d="M30 50 Q35 40 40 50 Q45 60 30 50" fill="%238b0000" opacity="0.4"/><path d="M60 20 Q65 10 70 20 Q75 30 60 20" fill="%238b0000" opacity="0.5"/></svg>');
        background-repeat: repeat;
        background-size: 100px 100px;
        opacity: 0;
        animation: bloodSplatter 0.5s ease-out forwards;
      }

      @keyframes bloodSplatter {
        0% {
          opacity: 0;
          transform: scale(1);
        }
        20% {
          opacity: 0.8;
        }
        100% {
          opacity: 0;
          transform: scale(1.2);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translate(0, 0);
        }
        10% {
          transform: translate(-5px, -3px);
        }
        20% {
          transform: translate(4px, 2px);
        }
        30% {
          transform: translate(-3px, 4px);
        }
        40% {
          transform: translate(2px, -2px);
        }
        50% {
          transform: translate(-2px, 3px);
        }
        60% {
          transform: translate(1px, -1px);
        }
        70% {
          transform: translate(-1px, 2px);
        }
        80% {
          transform: translate(0px, -1px);
        }
        90% {
          transform: translate(1px, 0px);
        }
      }

      .shake-active {
        animation: shake 0.3s ease-in-out;
      }

      /* Efeito de pulso vermelho nas bordas */
      .red-pulse {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 999;
        box-shadow: inset 0 0 50px 20px rgba(255, 0, 0, 0);
        animation: redPulse 0.5s ease-out forwards;
      }

      @keyframes redPulse {
        0% {
          box-shadow: inset 0 0 0 0 rgba(255, 0, 0, 0);
        }
        50% {
          box-shadow: inset 0 0 100px 40px rgba(255, 0, 0, 0.6);
        }
        100% {
          box-shadow: inset 0 0 0 0 rgba(255, 0, 0, 0);
        }
      }

      @keyframes cameraShake {
        0% {
          transform: translate(0px, 0px);
        }
        25% {
          transform: translate(-3px, 2px);
        }
        50% {
          transform: translate(3px, -2px);
        }
        75% {
          transform: translate(-2px, -1px);
        }
        100% {
          transform: translate(2px, 1px);
        }
      }

      .shake-camera {
        animation: cameraShake 0.3s ease-in-out;
      }

      .container {
        height: 100%;
        padding-bottom: 100px;
      }

      .doom-title {
        display: flex;
        width: 100%;
        height: 100px;
        justify-content: center;
        align-items: center;
        margin-bottom: 8px;

        img {
          width: 200px;
          height: 200px;
        }
      }

      .game-container {
        width: 100%;
        height: 100%;
        background: #000000cc;
        border-radius: 24px;
        border: 1px solid #3e2a1f;
        padding: 1rem;
        box-shadow:
          0 20px 35px rgba(0, 0, 0, 0.7),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);

        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .game-container::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.1) 0px,
          rgba(0, 0, 0, 0.1) 2px,
          transparent 2px,
          transparent 4px
        );
        pointer-events: none;
        border-radius: 24px;
      }

      .doom-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;

        background: #0b0e14;
        border-radius: 18px;
      }

      .info-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: space-between;

        padding: 12px 16px;

        background: #637879d7;
        border-bottom: 3px solid #b53b1c;
      }

      .stat {
        background: #00000099;
        padding: 6px 12px;
        border-radius: 20px;
        border-left: 3px solid #e35f21;

        color: #f0e6a0;
        font-weight: bold;
        font-size: 0.95rem;
      }

      .stat span {
        color: #f68836;
      }

      .icon {
        color: #f68836;
      }

      .controls-tip {
        background: #000000aa;
        padding: 6px 12px;
        border-radius: 20px;

        color: #deb887;
        font-size: 0.75rem;
        font-weight: bold;
      }

      .doomInterface {
        flex: 1;

        display: flex;
        overflow: hidden;

        background: #000;
      }

      /* ================= GAME ================= */

      .game-area {
        width: 70%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background: linear-gradient(360deg, #cc0d0dbe, #5c0506bd, #461803b4);
        overflow: hidden;
      }

      .doom-face-player {
        width: 200px;
        height: 200px;
        display: flex;
        position: relative;
        border: 3px solid #2a2e32;
        margin: 10px;
        align-self: flex-end;
        margin-left: auto;

        img {
          width: 100%;
          height: 100%;
        }
      }

      .canvas-wrapper {
        width: 50%;
        height: 100%;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      #doomCanvas {
        display: block;

        max-width: 100%;
        max-height: 100%;

        width: auto;
        height: auto;

        object-fit: contain;

        background: #000;

        image-rendering: pixelated;

        box-shadow:
          0 0 0 4px #2a1e12,
          0 0 0 8px #1a120a;
      }

      /* ================= CONSOLE ================= */

      .console-panel {
        display: flex;
        flex-direction: column;
        background: #010101e6;
        border-left: 3px solid #6a3e1a;
        overflow: hidden;
        max-height: 100%;
        width: 30%;
        /* IMPORTANTE */
      }

      .console-area {
        overflow-y: auto;
        overflow: hidden;
        padding: 1rem;
        background: #020202cc;
        color: #8bc34a;
        font-size: 0.8rem;
        line-height: 1.5;
        border-bottom: 1px solid #3a281a;
        text-shadow: 0 0 2px #1f3a0a;
        word-break: break-word;
      }

      .console-area::-webkit-scrollbar {
        width: 6px;
      }

      .console-area::-webkit-scrollbar-track {
        background: #1f140c;
      }

      .console-area::-webkit-scrollbar-thumb {
        background: #8b5a2b;
        border-radius: 10px;
      }

      .weapon-art {
        display: none;

        width: 90%;
        max-height: 180px;

        margin: 12px auto;

        object-fit: contain;

        border: 2px solid #ff2a2a;
        border-radius: 8px;

        background: rgba(0, 0, 0, 0.7);

        box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
      }

      .console-actions {
        display: flex;
        justify-content: center;
        align-items: center;

        padding: 1rem;

        background: #030302;

        border-top: 1px solid #7a4a1e;
      }

      button {
        background: #2c1d12;
        color: #ffbc6e;

        border: 1px solid #b87a36;

        padding: 10px 18px;

        border-radius: 30px;

        font-family: monospace;
        font-weight: bold;

        cursor: pointer;

        transition: 0.15s;
      }

      button:hover {
        background: #4d2f1c;
        color: #ffd894;
      }

      button:active {
        transform: translateY(2px);
      }

      /* ================= FX ================= */

      @keyframes explode {
        0% {
          transform: scale(0);
          opacity: 1;
        }

        100% {
          transform: scale(2);
          opacity: 0;
        }
      }

      .explosion-effect {
        position: absolute;

        width: 60px;
        height: 60px;

        border-radius: 50%;

        background: radial-gradient(circle, #ff6600, #ff3300, #ff0000);

        pointer-events: none;

        animation: explode 0.5s ease-out forwards;

        z-index: 999;
      }

      /* ================= MOBILE ================= */

      @media (max-width: 900px) {
        .doomInterface {
          flex-direction: column;
        }

        .console-panel {
          min-width: unset;
          height: 40%;
        }

        .game-area {
          height: 60%;
        }

        .info-bar {
          justify-content: center;
        }

        .console-area {
          font-size: 0.72rem;
        }
      }

      /* TELA DE GAME OVER ESTILO DOOM */
      .gameover-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          135deg,
          #0a00009f 0%,
          #2a000052 50%,
          #0a00007c 100%
        );
        z-index: 2000;
        display: none;
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition: opacity 0.8s ease;
        font-family: "DotGothic16", sans-serif, monospace;
      }

      .gameover-screen.show {
        display: flex;
        animation: fadeInDoom 0.8s ease forwards;
      }

      @keyframes fadeInDoom {
        0% {
          opacity: 0;
          transform: translateY(100%);
        }
        100% {
          opacity: 1;
          transform: translateY(0%);
        }
      }

      .gameover-content {
        text-align: center;
        animation: shakeDoom 0.5s ease-in-out;
      }

      .gameover-title {
        font-size: 5rem;
        font-weight: bold;
        color: #8b0000;
        text-shadow:
          0 0 10px #ff0000,
          0 0 20px #ff0000,
          0 0 40px #ff0000,
          4px 4px 0 #2a0000;
        letter-spacing: 8px;
        margin-bottom: 2rem;
        animation: pulseText 1.5s ease-in-out infinite;
      }

      @keyframes pulseText {
        0%,
        100% {
          text-shadow:
            0 0 10px #ff0000,
            0 0 20px #ff0000,
            0 0 40px #ff0000,
            4px 4px 0 #2a0000;
          transform: scale(1);
        }
        50% {
          text-shadow:
            0 0 20px #ff0000,
            0 0 40px #ff0000,
            0 0 60px #ff0000,
            4px 4px 0 #2a0000;
          transform: scale(1.05);
        }
      }

      @keyframes shakeDoom {
        0%,
        100% {
          transform: translate(0, 0);
        }
        10% {
          transform: translate(-10px, -5px);
        }
        20% {
          transform: translate(8px, 4px);
        }
        30% {
          transform: translate(-6px, 6px);
        }
        40% {
          transform: translate(4px, -4px);
        }
        50% {
          transform: translate(-3px, 3px);
        }
        60% {
          transform: translate(2px, -2px);
        }
        70% {
          transform: translate(-1px, 1px);
        }
      }

      .gameover-stats {
        background: rgba(0, 0, 0, 0.8);
        border: 3px solid #8b0000;
        padding: 2rem;
        margin: 2rem auto;
        box-shadow: 0 0 30px rgba(139, 0, 0, 0.5);
      }

      .gameover-stats p {
        color: #ff6b6b;
        font-size: 1.5rem;
        margin: 1rem 0;
        text-shadow: 0 0 5px #ff0000;
      }

      .gameover-stats .score {
        font-size: 2rem;
        color: #ff4444;
        font-weight: bold;
      }

      .gameover-button {
        background: #2a0000;
        color: #ff6b6b;
        border: 2px solid #8b0000;
        padding: 15px 40px;
        font-size: 1.3rem;
        font-family: "DotGothic16", sans-serif, monospace;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .gameover-button:hover {
        background: #8b0000;
        color: #ffffff;
        border-color: #ff0000;
        box-shadow: 0 0 20px rgba(139, 0, 0, 0.8);
        transform: scale(1.05);
      }

      .gameover-symbol {
        font-size: 4rem;
        margin-bottom: 1rem;
        animation: spinSkull 2s ease-in-out infinite;
      }

      @keyframes spinSkull {
        0%,
        100% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(10deg);
        }
        75% {
          transform: rotate(-10deg);
        }
      }

      .blood-drip {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background: repeating-linear-gradient(
          180deg,
          transparent,
          transparent 90%,
          rgba(139, 0, 0, 0.3) 90%,
          rgba(139, 0, 0, 0.5) 95%
        );
        animation: drip 2s linear infinite;
      }

      @keyframes drip {
        0% {
          background-position: 0 0;
        }
        100% {
          background-position: 0 20px;
        }
      }
    </style>
  </head>

  <body>
    <div class="damage-overlay" id="damageOverlay">
      <div class="screen-blood"></div>
      <div class="blood-splatter"></div>
    </div>
    <div class="container">
      <div class="doom-title">
        <img src="./img/doom-titulo.png" alt="" />
      </div>
      <div class="game-container">
        <div class="doom-panel">
          <div class="info-bar">
            <div class="stat">
              <i class="fa-solid fa-skull icon"></i> VIDA:
              <span id="vidaVal">100</span>%
            </div>
            <div class="stat">
              <i class="fa-solid fa-gun icon"></i> SHOTGUN:
              <span id="municaoVal">20</span>
            </div>
            <div class="stat">
              <i class="fa-solid fa-star icon"></i> SCORE:
              <span id="pontuacaoVal">0</span>
            </div>
            <div class="stat">ALVOS: <span id="inimigosRest">6</span></div>
            <div class="controls-tip">
              <i class="fa-solid fa-gamepad icon"></i> WASD mover | [F] ATIRAR |
              [Q] SAIR
            </div>
          </div>
          <div class="doomInterface">
            <!-- COLUNA ESQUERDA: JOGO (canvas) -->
            <div class="game-area">
              <div class="canvas-wrapper">
                <canvas id="doomCanvas" width="600" height="450"></canvas>
              </div>
              <div class="doom-face-player">
                <img src="./img/doom-face-player.jpg" alt="" />
              </div>
            </div>

            <!-- COLUNA DIREITA: CONSOLE + WEAPON ART + AÇÕES -->
            <div class="console-panel">
              <!-- Área de log / mensagens (id mantido para JS) -->
              <div class="console-area" id="logArea"></div>

              <!-- Painel de arte da arma (dynamic, mesmo id usado no script original) -->
              <img
                id="weaponArtPanel"
                class="weapon-art"
                src=""
                alt="weapon visual"
              />

              <!-- rodapé com botão restart e status BFG -->
              <div class="console-actions">
                <button id="resetBtn">🔥 RENASCER (RESTART)</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- TELA DE GAME OVER -->
    <div class="gameover-screen" id="gameoverScreen">
      <div class="blood-drip"></div>
      <div class="gameover-content">
        <div class="gameover-symbol">💀☠️💀</div>
        <div class="gameover-title">GAME OVER</div>
        <div class="gameover-stats">
          <p>🔥 VOCÊ FOI DERROTADO 🔥</p>
          <p>PONTUAÇÃO FINAL: <span class="score" id="finalScore">0</span></p>
          <p>INIMIGOS RESTANTES: <span id="remainingEnemies">0</span></p>
          <p>⏰ O INFERNO VENCEU... POR ENQUANTO ⏰</p>
        </div>
        <button class="gameover-button" id="restartGameBtn">
          🔫 RENASCER E VINGAR-SE 🔫
        </button>
      </div>
    </div>
    <script>
      // ==============================  ESTRUTURA DO JOGO  =================================
      // Mapa 20x15 (X horizontal, Y vertical)
      let mapY = 15;
      let mapX = 20;
      let mapa = Array(mapX + 1)
        .fill()
        .map(() => Array(mapY + 1).fill(0));

      // Status Marine
      let jogadorX = 10,
        jogadorY = 8;
      let vida = 100,
        municao = 20,
        pontuacao = 0;

      // Horda demoníaca (6 inimigos)
      let inimigoX = new Array(7);
      let inimigoY = new Array(7);
      let inimigoVivo = new Array(7);
      let contadorInimigos = 6;

      let jogoAtivo = true;

      // Controle de interface de tiro (sistema sequencial)
      let aguardandoArma = false;
      let aguardandoDirecao = false;
      let armaSelecionadaTemp = 0;
      let esperandoInput = false; // trava teclas de movimento enquanto aguarda escolha

      // Elementos DOM
      const canvas = document.getElementById("doomCanvas");
      const ctx = canvas.getContext("2d");
      const vidaSpan = document.getElementById("vidaVal");
      const municaoSpan = document.getElementById("municaoVal");
      const pontuacaoSpan = document.getElementById("pontuacaoVal");
      const inimigosSpan = document.getElementById("inimigosRest");
      const logArea = document.getElementById("logArea");
      const weaponArtImg = document.getElementById("weaponArtPanel"); // Agora é uma tag <img>
      const resetBtn = document.getElementById("resetBtn");

      const gameoverScreen = document.getElementById("gameoverScreen");
      const finalScoreSpan = document.getElementById("finalScore");
      const remainingEnemiesSpan = document.getElementById("remainingEnemies");
      const restartGameBtn = document.getElementById("restartGameBtn");

      // células de desenho (tamanho 30x30)
      const CELL_W = 30;
      const CELL_H = 30;

      let canvaW = document.querySelector("canvas").width;
      let canvaH = document.querySelector("canvas").height;

      // ----------  ARTE DAS ARMAS (IMAGENS)  ----------
      const armasArt = {
        1: "./img/SuperShotgun.png",
        2: "./img/Chainsaw.png",
        3: "./img/PlasmaRifle.png",
        4: "./img/RPG-7.png",
        5: "./img/BFG-9000.png",
      };

      // Substitua a função addLog inteira por esta versão
      function addLog(msg) {
        const p = document.createElement("div");
        p.innerHTML = `> ${msg}`;
        logArea.appendChild(p);

        // Limite de 40 mensagens no DOM para evitar crescimento infinito
        const MAX_MESSAGES = 6;
        while (logArea.children.length > MAX_MESSAGES) {
          logArea.removeChild(logArea.firstChild);
        }

        // Garante scroll automático para o final
        logArea.scrollTop = logArea.scrollHeight;
      }

      function exibirArteArma(armaNum) {
        if (armasArt[armaNum]) {
          weaponArtImg.src = armasArt[armaNum];
          weaponArtImg.style.display = "block";
          weaponArtImg.style.maxWidth = "100%";
          weaponArtImg.style.maxHeight = "200px";
          weaponArtImg.style.objectFit = "contain";
          addLog(`🎨 Arma ${armaNum} equipada!`);
        } else {
          weaponArtImg.style.display = "none";
          weaponArtImg.src = "";
        }
      }

      function limparArte() {
        weaponArtImg.style.display = "none";
        weaponArtImg.src = "";
      }

      // =========================  INICIALIZAÇÃO DO MUNDO ==========================
      function inicializarJogo() {
        vida = 100;
        municao = 20;
        pontuacao = 0;
        contadorInimigos = 6;
        jogoAtivo = true;
        aguardandoArma = false;
        aguardandoDirecao = false;
        esperandoInput = false;
        armaSelecionadaTemp = 0;
        resetBtn.style.display = "none";
        limparArte();

        // 1. Limpar mapa (chão 0)
        for (let x = 1; x <= mapX; x++) {
          for (let y = 1; y <= mapY; y++) {
            mapa[x][y] = 0;
          }
        }
        // 2. Paredes bordas
        for (let x = 1; x <= mapX; x++) {
          mapa[x][1] = 1;
          mapa[x][mapY] = 1;
        }
        for (let y = 1; y <= mapY; y++) {
          mapa[1][y] = 1;
          mapa[mapX][y] = 1;
        }
        // 3. Obstáculos internos (labirinto)
        mapa[5][5] = 1;
        mapa[5][6] = 1;
        mapa[15][10] = 1;
        mapa[15][11] = 1;

        // 4. Jogador
        jogadorX = 10;
        jogadorY = 8;
        mapa[jogadorX][jogadorY] = 2;

        // 5. Inimigos hardcoded
        const posInimigos = [
          { x: 3, y: 3 },
          { x: 17, y: 3 },
          { x: 3, y: 12 },
          { x: 17, y: 12 },
          { x: 10, y: 3 },
          { x: 10, y: 13 },
        ];
        for (let i = 1; i <= 6; i++) {
          inimigoVivo[i] = true;
          inimigoX[i] = posInimigos[i - 1].x;
          inimigoY[i] = posInimigos[i - 1].y;
          mapa[inimigoX[i]][inimigoY[i]] = 3;
        }

        atualizarUI();
        desenharMapa();
      }

      function atualizarUI() {
        // Animação de dano na vida
        const vidaElement = document.getElementById("vidaVal");
        if (vidaElement && parseInt(vidaElement.innerText) > vida) {
          vidaElement.style.animation = "damageNumber 0.3s ease-in-out";
          setTimeout(() => {
            vidaElement.style.animation = "";
          }, 300);
        }

        vidaSpan.innerText = vida;
        municaoSpan.innerText = municao;
        pontuacaoSpan.innerText = pontuacao;
        inimigosSpan.innerText = contadorInimigos;

        // Efeito de perigo quando vida baixa
        if (vida <= 30 && vida > 0) {
          vidaElement.style.animation = "pulseRed 0.5s ease-in-out infinite";
        } else if (vidaElement) {
          vidaElement.style.animation = "";
        }
      }

      // Adicionar keyframe para dano no número
      const damageNumberStyle = document.createElement("style");
      damageNumberStyle.textContent = `
  @keyframes damageNumber {
    0% { transform: scale(1); color: #f0e6a0; }
    50% { transform: scale(1.3); color: #ff0000; text-shadow: 0 0 5px rgba(255,0,0,0.8); }
    100% { transform: scale(1); color: #f0e6a0; }
  }
`;
      document.head.appendChild(damageNumberStyle);
      const imagens = {};
      const arquivos = {
        marine: "./img/doom-avatar.jpg",
        demon: "./img/enemy.png",
      };
      let imagensCarregadas = 0;
      const totalImagens = Object.keys(arquivos).length;
      function loadImages() {
        for (let chave in arquivos) {
          imagens[chave] = new Image();
          imagens[chave].src = arquivos[chave];

          imagens[chave].onload = () => {
            imagensCarregadas++;
            if (imagensCarregadas === totalImagens) {
              inicializarJogo();
            }
          };
          imagens[chave].onerror = function () {
            console.error("Erro ao carregar a imagem: " + arquivos[chave]);
          };
        }
      }
      loadImages();

      // =========================  RENDER CANVAS ESTILO DOOM ==========================
      function desenharMapa() {
        if (!jogoAtivo) return;
        ctx.clearRect(0, 0, canvaW, canvaH);
        for (let y = 1; y <= mapY; y++) {
          for (let x = 1; x <= mapX; x++) {
            let tile = mapa[x][y];
            let px = (x - 1) * CELL_W;
            let py = (y - 1) * CELL_H;
            if (tile === 1) {
              // parede
              ctx.fillStyle = "#3c2a23";
              ctx.fillRect(px, py, CELL_W - 1, CELL_H - 1);
              ctx.fillStyle = "#5e3e2c";
              ctx.fillRect(px + 2, py + 2, CELL_W - 5, CELL_H - 5);
              ctx.fillStyle = "#1f140e";
              ctx.fillRect(px + 4, py + 4, CELL_W - 9, CELL_H - 9);
            } else if (tile === 2) {
              // Marine
              ctx.drawImage(
                imagens.marine,
                px + 1,
                py + 1,
                CELL_W + 5,
                CELL_H + 5,
              );
            } else if (tile === 3) {
              // Monstro
              ctx.drawImage(
                imagens.demon,
                px + 1,
                py + 1,
                CELL_W + 5,
                CELL_H + 5,
              );
            } else {
              ctx.fillStyle = "#120e0a";
              ctx.fillRect(px, py, CELL_W - 1, CELL_H - 1);
              ctx.fillStyle = "#2f2a1f";
              ctx.fillRect(px + 1, py + 1, CELL_W - 3, CELL_H - 3);
            }
          }
        }
        // bordas
        ctx.strokeStyle = "#b87c4f";
        ctx.lineWidth = 2;
        ctx.strokeRect(0, 0, canvaW, canvaH);
      }

      function aplicarEfeitoDano() {
        // Overlay de dano
        const damageOverlay = document.getElementById("damageOverlay");
        if (!damageOverlay) return;

        // Ativar overlay
        damageOverlay.classList.add("active");

        // Criar efeito de shake na tela
        document.body.classList.add("shake-active");

        // Criar efeito de pulso vermelho
        const redPulse = document.createElement("div");
        redPulse.className = "red-pulse";
        document.body.appendChild(redPulse);

        // Remover efeitos após animação
        setTimeout(() => {
          damageOverlay.classList.remove("active");
          document.body.classList.remove("shake-active");
          document
            .querySelector(".game-container")
            .classList.add("shake-camera");
          if (redPulse && redPulse.parentNode) {
            redPulse.parentNode.removeChild(redPulse);
          }
        }, 300);

        // Criar partículas de sangue adicionais
        criarParticulasSangue();
      }

      function criarParticulasSangue() {
        const container = document.querySelector(".game-container");
        if (!container) return;

        // Criar várias partículas de sangue
        for (let i = 0; i < 15; i++) {
          const particula = document.createElement("div");
          particula.style.position = "absolute";
          particula.style.width = Math.random() * 8 + 4 + "px";
          particula.style.height = Math.random() * 8 + 4 + "px";
          particula.style.backgroundColor = `rgba(139, ${Math.random() * 50}, 0, ${Math.random() * 0.7 + 0.3})`;
          particula.style.borderRadius = "50%";
          particula.style.left = Math.random() * 100 + "%";
          particula.style.top = Math.random() * 100 + "%";
          particula.style.pointerEvents = "none";
          particula.style.zIndex = "1001";
          particula.style.animation = `floatBlood ${Math.random() * 1 + 0.5}s ease-out forwards`;

          container.appendChild(particula);

          // Remover partícula após animação
          setTimeout(() => {
            if (particula.parentNode)
              particula.parentNode.removeChild(particula);
          }, 500);
        }
      }

      // Adicionar keyframe para a animação de flutuação
      const style = document.createElement("style");
      style.textContent = `
  @keyframes floatBlood {
    0% {
      transform: translate(0, 0) scale(1);
      opacity: 1;
    }
    100% {
      transform: translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px) scale(0);
      opacity: 0;
    }
  }
`;
      document.head.appendChild(style);

      // Função para atualizar a UI com efeito visual quando a vida baixa
      function atualizarUIComEfeito() {
        atualizarUI();

        // Efeito de perigo quando vida está baixa
        if (vida <= 30 && vida > 0) {
          const vidaElement = document.getElementById("vidaVal");
          if (vidaElement) {
            vidaElement.style.animation = "pulseRed 0.5s ease-in-out infinite";
          }
        } else {
          const vidaElement = document.getElementById("vidaVal");
          if (vidaElement) {
            vidaElement.style.animation = "";
          }
        }
      }

      // Adicionar keyframe para pulso vermelho
      const pulseStyle = document.createElement("style");
      pulseStyle.textContent = `
  @keyframes pulseRed {
    0%, 100% { color: #f0e6a0; text-shadow: 0 0 0px rgba(255,0,0,0); }
    50% { color: #ff0000; text-shadow: 0 0 10px rgba(255,0,0,0.8); }
  }
`;
      document.head.appendChild(pulseStyle);

      // =========================  MOVIMENTAÇÃO DOS DEMÔNIOS (IA) ==========================
      function moverDemonios() {
        if (!jogoAtivo) return;
        for (let i = 1; i <= 6; i++) {
          if (!inimigoVivo[i]) continue;

          let dx = 0,
            dy = 0;
          if (jogadorX > inimigoX[i]) dx = 1;
          else if (jogadorX < inimigoX[i]) dx = -1;

          if (jogadorY > inimigoY[i]) dy = 1;
          else if (jogadorY < inimigoY[i]) dy = -1;

          // aleatório mover X ou Y (rand entre 0 e 1)
          let randDir = Math.floor(Math.random() * 2);
          let proxX = inimigoX[i],
            proxY = inimigoY[i];
          if (randDir === 0) {
            proxX = inimigoX[i] + dx;
            proxY = inimigoY[i];
          } else {
            proxX = inimigoX[i];
            proxY = inimigoY[i] + dy;
          }

          // limites e colisões
          if (proxX >= 1 && proxX <= mapX && proxY >= 1 && proxY <= mapY) {
            // Se inimigo encontra o jogador = dano
            if (proxX === jogadorX && proxY === jogadorY) {
              vida -= 10;
              addLog(`💔 Demônio te acertou! Vida: ${vida}`);
              // ADICIONE ESTA LINHA:
              aplicarEfeitoDano(); // Efeito visual de dano
              atualizarUIComEfeito(); // Atualiza UI com efeito
              if (vida <= 0) {
                finalizarJogo(false);
                return;
              }
              continue;
            }
            // se célula vazia (0) pode mover
            if (mapa[proxX][proxY] === 0) {
              // remove antiga posição
              mapa[inimigoX[i]][inimigoY[i]] = 0;
              // atualiza coordenadas
              inimigoX[i] = proxX;
              inimigoY[i] = proxY;
              mapa[inimigoX[i]][inimigoY[i]] = 3;
            } // se for parede ou outro monstro, fica parado
          }
        }
        desenharMapa();
      }
      // =========================  FLUXO DE TIRO COM ARTE E ESCOLHA ==========================
      function iniciarSequenciaTiro() {
        if (!jogoAtivo) return;
        if (aguardandoArma || aguardandoDirecao) {
          addLog(
            "⏳ Já está em modo de tiro. Escolha arma (1-5) ou cancele com ESC.",
          );
          return;
        }
        if (municao === 0) {
          addLog("❌ SEM MUNIÇÃO! Mate demônios para ganhar munição!");
          return;
        }
        aguardandoArma = true;
        esperandoInput = true;
        addLog(
          "🎯 ESCOLHA SUA ARMA: <br> [1] Super Shotgun <br> [2] Chainsaw <br> [3] Plasma <br> [4] RPG-7 <br> [5] BFG-9000",
        );
        limparArte();
      }

      function processarEscolhaArma(teclaNum) {
        if (!aguardandoArma) return false;
        let arma = parseInt(teclaNum);
        if (arma >= 1 && arma <= 5) {
          armaSelecionadaTemp = arma;
          exibirArteArma(arma);
          let nomeArma = "";
          switch (arma) {
            case 1:
              nomeArma = "Super Shotgun";
              break;
            case 2:
              nomeArma = "Chainsaw";
              break;
            case 3:
              nomeArma = "Plasma Rifle";
              break;
            case 4:
              nomeArma = "RPG-7";
              break;
            case 5:
              nomeArma = "BFG-9000";
              break;
          }
          addLog(`🔻 ARMA SELECIONADA: ${nomeArma}. AGORA MIRE (W/A/S/D)`);
          aguardandoArma = false;
          aguardandoDirecao = true;
          return true;
        } else {
          addLog("⚠️ Arma inválida. Digite 1 a 5.");
          return false;
        }
      }

      function processarDirecaoTiro(teclaDir) {
        if (!aguardandoDirecao) return false;
        let dir = teclaDir.toLowerCase();
        if (dir === "w" || dir === "a" || dir === "s" || dir === "d") {
          addLog(
            `🎯 ATIRANDO para ${dir.toUpperCase()} com a arma ${armaSelecionadaTemp}!`,
          );
          executarDisparo(dir);
          // finaliza modo tiro
          aguardandoDirecao = false;
          esperandoInput = false;
          armaSelecionadaTemp = 0;
          limparArte();
          // após tiro, inimigos se movem
          if (jogoAtivo) {
            moverDemonios();
            desenharMapa();
            if (vida <= 0) finalizarJogo(false);
            else if (contadorInimigos === 0) finalizarJogo(true);
          }
          return true;
        } else {
          addLog(
            "❌ Direção inválida! Use W (cima), A (esq), S (baixo), D (dir) para mirar.",
          );
          return false;
        }
      }

      function cancelarModoTiro() {
        if (aguardandoArma || aguardandoDirecao) {
          addLog("🚫 Modo de tiro cancelado.");
          aguardandoArma = false;
          aguardandoDirecao = false;
          esperandoInput = false;
          armaSelecionadaTemp = 0;
          limparArte();
        }
      }

      // =========================  MOVIMENTO DO JOGADOR  ==========================
      function moverJogador(dx, dy) {
        if (!jogoAtivo) return false;
        if (esperandoInput) return false;
        let novoX = jogadorX + dx;
        let novoY = jogadorY + dy;
        if (
          novoX >= 1 &&
          novoX <= mapX &&
          novoY >= 1 &&
          novoY <= mapY &&
          mapa[novoX][novoY] === 0
        ) {
          // limpa posição antiga
          mapa[jogadorX][jogadorY] = 0;
          jogadorX = novoX;
          jogadorY = novoY;
          mapa[jogadorX][jogadorY] = 2;
          desenharMapa();
          // inimigos se movem após ação do jogador
          moverDemonios();
          if (vida <= 0) finalizarJogo(false);
          else if (contadorInimigos === 0) finalizarJogo(true);
          return true;
        } else if (mapa[novoX][novoY] === 3) {
          addLog("⚠️ Caminho bloqueado por um demônio! Atire nele primeiro.");
        }
        return false;
      }

      // Adicione esta função para efeito de explosão
      function criarEfeitoExplosao(x, y) {
        // Desenha animação de explosão no canvas
        let frames = 0;
        const animacao = setInterval(() => {
          if (!jogoAtivo || frames >= 8) {
            clearInterval(animacao);
            desenharMapa();
            return;
          }

          // Desenha efeito de explosão
          const px = (x - 1) * CELL_W;
          const py = (y - 1) * CELL_H;

          ctx.save();
          ctx.shadowBlur = 15;
          ctx.shadowColor = "orange";

          // Círculos de explosão
          const intensidade = frames / 8;
          const raio = CELL_W * (0.5 + intensidade * 2);

          ctx.beginPath();
          ctx.arc(px + CELL_W / 2, py + CELL_H / 2, raio, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, ${100 - frames * 20}, 0, ${0.8 - intensidade})`;
          ctx.fill();

          ctx.beginPath();
          ctx.arc(px + CELL_W / 2, py + CELL_H / 2, raio * 0.6, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, ${100 - frames * mapX}, ${0.9 - intensidade})`;
          ctx.fill();

          ctx.restore();

          frames++;
        }, 50);
      }

      // Função modificada para destruir cenário em área
      function destruirCenarioArea(centroX, centroY, raio) {
        let algoDestruido = false;

        for (let dx = -raio; dx <= raio; dx++) {
          for (let dy = -raio; dy <= raio; dy++) {
            const x = centroX + dx;
            const y = centroY + dy;

            // Verifica se está dentro do círculo de explosão
            const distancia = Math.sqrt(dx * dx + dy * dy);
            if (
              distancia <= raio &&
              x >= 1 &&
              x <= mapX &&
              y >= 1 &&
              y <= mapY
            ) {
              // Remove paredes (valor 1) e transforma em chão (0)
              if (mapa[x][y] === 1) {
                mapa[x][y] = 0;
                algoDestruido = true;
                addLog(`💥 Parede destruída em (${x}, ${y})!`);
              }
            }
          }
        }

        if (algoDestruido) {
          addLog("🏚️ EXPLOSÃO ABRIU CAMINHO! O cenário foi danificado.");
        }

        return algoDestruido;
      }

      // Função modificada para dano em área nos inimigos
      function danoAreaInimigos(centroX, centroY, raio) {
        let inimigosAtingidos = 0;

        for (let i = 1; i <= 6; i++) {
          if (!inimigoVivo[i]) continue;

          const dx = inimigoX[i] - centroX;
          const dy = inimigoY[i] - centroY;
          const distancia = Math.sqrt(dx * dx + dy * dy);

          // Inimigos dentro do raio da explosão
          if (distancia <= raio) {
            // Mata o inimigo
            inimigoVivo[i] = false;
            contadorInimigos--;
            pontuacao += 100;
            municao += 2;
            mapa[inimigoX[i]][inimigoY[i]] = 0;
            inimigosAtingidos++;

            addLog(`💀 INIMIGO ELIMINADO PELA EXPLOSÃO! +100 pontos`);

            // Cria efeito de explosão em cada inimigo atingido
            criarEfeitoExplosao(inimigoX[i], inimigoY[i]);
          }
        }

        if (inimigosAtingidos > 0) {
          addLog(
            `🔥 RPG ACERTOU ${inimigosAtingidos} INIMIGO(S)! Massacre múltiplo!`,
          );
          atualizarUI();
        }

        return inimigosAtingidos;
      }

      // Função modificada de disparo para suportar efeitos especiais por arma
      function executarDisparo(direcao) {
        if (!jogoAtivo) return false;
        if (municao <= 0) {
          addLog(
            "🔇 SEM MUNIÇÃO! Procure matar demônios para ganhar balas (+2 por abate).",
          );
          return false;
        }
        if (!armaSelecionadaTemp) {
          addLog("ERRO: nenhuma arma selecionada, tente novamente.");
          return false;
        }

        // Gasta munição
        municao--;

        // ============ ARMA 4: RPG-7 (DANO EM ÁREA E DESTRUIÇÃO) ============
        if (armaSelecionadaTemp === 4) {
          let tiroX = jogadorX;
          let tiroY = jogadorY;
          let dir = direcao.toLowerCase();

          // Move o projetil até o alvo ou parede
          while (tiroX > 1 && tiroX < mapX && tiroY > 1 && tiroY < mapY) {
            if (dir === "w") tiroY--;
            else if (dir === "s") tiroY++;
            else if (dir === "a") tiroX--;
            else if (dir === "d") tiroX++;

            // Se encontrar parede, explode nela
            if (mapa[tiroX][tiroY] === 1) {
              addLog(`💥 RPG ACERTOU UMA PAREDE! EXPLOSÃO EM ÁREA!`);
              break;
            }

            // Se encontrar monstro, explode nele
            if (mapa[tiroX][tiroY] === 3) {
              addLog(`💥 RPG ACERTOU UM INIMIGO! EXPLOSÃO MASSIVA!`);
              break;
            }
          }

          // Cria efeito de explosão no ponto de impacto
          criarEfeitoExplosao(tiroX, tiroY);

          // Dano em área (raio 2 células)
          const RAIO_EXPLOSAO = 2;

          // Destroi cenário ao redor
          destruirCenarioArea(tiroX, tiroY, RAIO_EXPLOSAO);

          // Dano em todos inimigos próximos
          const inimigosMortos = danoAreaInimigos(tiroX, tiroY, RAIO_EXPLOSAO);

          if (inimigosMortos === 0) {
            addLog(
              `💣 EXPLOSÃO NA POSIÇÃO (${tiroX}, ${tiroY})! Nenhum inimigo na área.`,
            );
          }

          atualizarUI();

          // Verifica vitória
          if (contadorInimigos <= 0) {
            finalizarJogo(true);
            return true;
          }

          return true;
        }

        // ============ ARMAS NORMAIS (TIRO ÚNICO) ============
        let tiroX = jogadorX;
        let tiroY = jogadorY;
        let alvoAtingido = false;
        let dir = direcao.toLowerCase();

        while (
          tiroX > 1 &&
          tiroX < mapX &&
          tiroY > 1 &&
          tiroY < mapY &&
          !alvoAtingido
        ) {
          if (dir === "w") tiroY--;
          else if (dir === "s") tiroY++;
          else if (dir === "a") tiroX--;
          else if (dir === "d") tiroX++;
          else break;

          // Parede?
          if (mapa[tiroX][tiroY] === 1) {
            addLog(`💥 Tiro acertou uma parede!`);
            alvoAtingido = true;
            break;
          }
          // Acertou monstro?
          if (mapa[tiroX][tiroY] === 3) {
            for (let i = 1; i <= 6; i++) {
              if (
                inimigoVivo[i] &&
                inimigoX[i] === tiroX &&
                inimigoY[i] === tiroY
              ) {
                inimigoVivo[i] = false;
                contadorInimigos--;
                pontuacao += 100;
                municao += 2;
                mapa[tiroX][tiroY] = 0;
                addLog(
                  `🔥 MONSTRO ABATIDO! +100 pontos, +2 munição. Restam ${contadorInimigos} inimigos.`,
                );
                atualizarUI();
                alvoAtingido = true;
                break;
              }
            }
            break;
          }
        }
        if (!alvoAtingido)
          addLog(
            `🔫 Disparo na direção ${direcao.toUpperCase()} ecoou no vazio.`,
          );
        atualizarUI();

        // Verifica vitória
        if (contadorInimigos <= 0) {
          finalizarJogo(true);
          return true;
        }
        return true;
      }

      // =========================  FIM DE JOGO (GAME OVER / VITÓRIA) ==========================
      function finalizarJogo(vitoria) {
        if (!jogoAtivo) return;
        resetBtn.style.display = "flex";
        jogoAtivo = false;
        esperandoInput = true;
        cancelarModoTiro();

        if (vida <= 0) {
          addLog(`💀 GAME OVER! Sua alma pertence ao inferno. 💀`);
          addLog(`⚰️ SCORE FINAL: ${pontuacao} ⚰️`);
          mostrarTelaGameOver(); // Mostra a tela estilizada
        } else if (vitoria || contadorInimigos === 0) {
          addLog(`🌟🌟🌟 GRANDE VITORIA, MARINE! A BASE ESTA SEGURA. 🌟🌟🌟`);
          addLog(`🏆 SCORE FINAL: ${pontuacao}  🏆`);
        }
        desenharMapa();
        // mensagem final
        addLog("🔄 Pressione [RENASCER] para uma nova batalha.");
      }

      // Função para mostrar tela de Game Over
      function mostrarTelaGameOver() {
        finalScoreSpan.innerText = pontuacao;
        remainingEnemiesSpan.innerText = contadorInimigos;
        gameoverScreen.classList.add("show");

        // Tocar efeito sonoro (opcional - só se quiser)
        const audio = new Audio(
          "data:audio/wav;base64,U3RlYWx0aCBzb3VuZCBub3QgYXZhaWxhYmxl",
        );
        audio.play().catch((e) => console.log("Áudio não disponível"));
      }

      // Função para esconder tela de Game Over
      function esconderTelaGameOver() {
        gameoverScreen.classList.remove("show");
        setTimeout(() => {
          gameoverScreen.style.display = "none";
        }, 800);
      }

      restartGameBtn.addEventListener("click", () => {
        esconderTelaGameOver();
        inicializarJogo();
        jogoAtivo = true;
        esperandoInput = false;
        aguardandoArma = false;
        aguardandoDirecao = false;
        addLog("🔁 RENASCIDO DAS CINZAS! O inferno treme novamente.");
        desenharMapa();
      });

      // =========================  EVENTOS DE TECLADO ==========================
      function handleKeyDown(e) {
        const key = e.key;
        // sempre bloquear scroll com setas e WASD
        if (
          [
            "w",
            "W",
            "s",
            "S",
            "a",
            "A",
            "d",
            "D",
            "ArrowUp",
            "ArrowDown",
            "ArrowLeft",
            "ArrowRight",
            "f",
            "F",
            "q",
            "Q",
            "Escape",
            "1",
            "2",
            "3",
            "4",
            "5",
          ].includes(key)
        ) {
          e.preventDefault();
        }

        if (!jogoAtivo) {
          if (key === "r" || key === "R") {
            inicializarJogo();
            jogoAtivo = true;
            esperandoInput = false;
            addLog("🔁 RENASCIDO! O inferno treme novamente.");
            desenharMapa();
          }
          return;
        }

        // FLUXO DE TIRO PRIORITÁRIO
        if (aguardandoArma) {
          if (key >= "1" && key <= "5") {
            processarEscolhaArma(key);
          } else if (key === "Escape") {
            cancelarModoTiro();
          }
          return;
        }

        if (aguardandoDirecao) {
          if (
            key === "w" ||
            key === "W" ||
            key === "a" ||
            key === "A" ||
            key === "s" ||
            key === "S" ||
            key === "d" ||
            key === "D"
          ) {
            processarDirecaoTiro(key);
          } else if (key === "Escape") {
            cancelarModoTiro();
          }
          return;
        }

        // Modo normal (movimento e atirar)
        switch (key) {
          case "w":
          case "W":
            moverJogador(0, -1);
            break;
          case "s":
          case "S":
            moverJogador(0, 1);
            break;
          case "a":
          case "A":
            moverJogador(-1, 0);
            break;
          case "d":
          case "D":
            moverJogador(1, 0);
            break;
          case "f":
          case "F":
            iniciarSequenciaTiro();
            break;
          case "q":
          case "Q":
            addLog("🚪 SAÍDA SOLICITADA. MARINE ABANDONA O INFERNO.");
            finalizarJogo(false);
            break;
          case "Escape":
            break;
          default:
            break;
        }
        atualizarUI();
        desenharMapa();
        if (vida <= 0) finalizarJogo(false);
        if (contadorInimigos === 0) finalizarJogo(true);
      }

      // Botão reset
      resetBtn.addEventListener("click", () => {
        inicializarJogo();
        jogoAtivo = true;
        esperandoInput = false;
        aguardandoArma = false;
        aguardandoDirecao = false;
        desenharMapa();
      });

      window.addEventListener("keydown", handleKeyDown);
      inicializarJogo();
      desenharMapa();
    </script>
  </body>
</html>
